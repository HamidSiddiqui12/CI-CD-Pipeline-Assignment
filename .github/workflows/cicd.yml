name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-cicd-app
  ECR_REGISTRY: 097466312208.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # 1. Checkout source code
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # ----------------------------------------
      # 2. Setup Python
      # ----------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"


      # ----------------------------------------
      # 3. Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ----------------------------------------
      # 4. Run tests
      # ----------------------------------------
      - name: Run tests
        run: |
          python -m pytest


      # ----------------------------------------
      # 5. Configure AWS
      # ----------------------------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ----------------------------------------
      # 6. Login to Amazon ECR
      # ----------------------------------------
      - name: Login to ECR
        run: |
          echo "Logging into Amazon ECR..."

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "ECR login successful."


      # ----------------------------------------
      # 7. Build Docker image
      # ----------------------------------------
      - name: Build Docker image
        run: |
          echo "Building Docker image..."

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            .

          echo "Docker image built successfully."


      # ----------------------------------------
      # 8. Push Docker image to ECR
      # ----------------------------------------
      - name: Push image to ECR
        run: |
          echo "Pushing Docker image to ECR..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Docker image pushed successfully."


      # ----------------------------------------
      # 9. Deploy to EC2
      # ----------------------------------------
      - name: Deploy to EC2
        run: |
          echo "Starting EC2 deployment..."

          # Create SSH directory
          mkdir -p ~/.ssh

          # Save private key
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          # Protect private key
          chmod 600 ~/.ssh/ec2_key

          # Add EC2 host to known hosts
          echo "Testing EC2 host..."

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

          echo "Connecting to EC2..."

          ssh -v \
            -o ConnectTimeout=15 \
            -i ~/.ssh/ec2_key \
            ec2-user@"${{ secrets.EC2_HOST }}" << EOF

          set -e

          echo "======================================"
          echo "Connected to EC2 successfully"
          echo "======================================"

          echo "Checking AWS identity..."

          aws sts get-caller-identity

          echo "Checking Docker..."

          docker --version

          echo "======================================"
          echo "Logging into ECR"
          echo "======================================"

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "ECR login successful."

          echo "======================================"
          echo "Pulling Docker image"
          echo "======================================"

          docker pull \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Docker image pulled successfully."

          echo "======================================"
          echo "Stopping old container"
          echo "======================================"

          docker stop flask-cicd-app 2>/dev/null || true

          echo "======================================"
          echo "Removing old container"
          echo "======================================"

          docker rm flask-cicd-app 2>/dev/null || true

          echo "======================================"
          echo "Starting new container"
          echo "======================================"

          docker run -d \
            --name flask-cicd-app \
            --restart unless-stopped \
            -p 5000:5000 \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "======================================"
          echo "Checking running container"
          echo "======================================"

          docker ps

          echo "======================================"
          echo "Waiting for Flask application"
          echo "======================================"

          sleep 5

          echo "======================================"
          echo "Container logs"
          echo "======================================"

          docker logs flask-cicd-app

          echo "======================================"
          echo "Testing health endpoint"
          echo "======================================"

          curl --fail \
            http://localhost:5000/health

          echo ""
          echo "======================================"
          echo "Deployment successful!"
          echo "======================================"

          EOF


      # ----------------------------------------
      # 10. Deployment summary
      # ----------------------------------------
      - name: Deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "CI/CD PIPELINE COMPLETED SUCCESSFULLY"
          echo "======================================"
          echo "Image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          echo ""
          echo "EC2 deployment completed successfully."
          echo "Flask health check passed."


      # ----------------------------------------
      # 11. Failure summary
      # ----------------------------------------
      - name: Deployment failed
        if: failure()
        run: |
          echo "======================================"
          echo "CI/CD PIPELINE FAILED"
          echo "======================================"
          echo "Please check the failed step above."