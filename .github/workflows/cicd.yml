name: CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flask-cicd-app
  ECR_REGISTRY: 097466312208.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          echo "Logging into Amazon ECR..."

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "ECR login successful."

      - name: Build Docker image
        run: |
          echo "Building Docker image..."

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            .

          echo "Docker image built successfully."

      - name: Push image to ECR
        run: |
          echo "Pushing Docker image to ECR..."

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Docker image pushed successfully."

      - name: Deploy to EC2
        run: |
          echo "Starting EC2 deployment..."

          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          echo "Checking SSH key..."
          ssh-keygen -y -f ~/.ssh/ec2_key > /tmp/ec2_public_key
          echo "SSH key is valid."

          echo "Checking EC2 host..."

          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "ERROR: EC2_HOST secret is empty."
            exit 1
          fi

          echo "EC2_HOST secret exists."

          ssh-keyscan \
            -T 10 \
            -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts

          echo "EC2 host key retrieved successfully."

          echo "Connecting to EC2..."

          ssh \
            -o ConnectTimeout=15 \
            -i ~/.ssh/ec2_key \
            ec2-user@"${{ secrets.EC2_HOST }}" << EOF

          set -e

          echo "Connected to EC2 successfully."

          echo "Checking AWS identity..."
          aws sts get-caller-identity

          echo "Checking Docker..."
          docker --version

          echo "Logging into ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

          echo "ECR login successful."

          echo "Pulling Docker image..."

          docker pull \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Docker image pulled successfully."

          echo "Stopping old container..."

          docker stop flask-cicd-app 2>/dev/null || true

          echo "Removing old container..."

          docker rm flask-cicd-app 2>/dev/null || true

          echo "Starting new container..."

          docker run -d \
            --name flask-cicd-app \
            --restart unless-stopped \
            -p 5000:5000 \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          echo "Checking running container..."

          docker ps

          echo "Waiting for Flask application..."

          sleep 5

          echo "Container logs..."

          docker logs flask-cicd-app

          echo "Testing health endpoint..."

          curl --fail http://localhost:5000/health

          echo ""
          echo "Deployment successful!"

          EOF

      - name: Deployment summary
        if: success()
        run: |
          echo "CI/CD PIPELINE COMPLETED SUCCESSFULLY"
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "EC2 deployment completed successfully."
          echo "Flask health check passed."

      - name: Deployment failed
        if: failure()
        run: |
          echo "CI/CD PIPELINE FAILED"
          echo "Please check the failed step above."